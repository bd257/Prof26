<!-- ================= EXAM ROLL DIRECTORY ================= -->

<section class="card section" id="rollDirectory">


    <div class="section-title">


        <div>

            <p class="eyebrow">
                EXAM ROLL DIRECTORY
            </p>

            <h2>
                Search Your Roll
            </h2>

        </div>


        <span class="time-pill">
            84 Students
        </span>


    </div>



    <!-- SEARCH BOX -->

    <div class="roll-search-wrap">

        <input
            type="text"
            id="rollSearch"
            class="roll-search"
            placeholder="Type class roll, exam roll or name..."
            autocomplete="off"
            inputmode="text">

    </div>



    <!-- RESULTS COUNT -->

    <p id="rollResultsCount" class="roll-results-count">
        Showing all 84 students
    </p>



    <!-- DROPDOWN ACCORDION -->

    <div class="roll-accordion" id="rollAccordion">


        <button
            type="button"
            class="roll-accordion-toggle"
            id="rollToggle"
            aria-expanded="false"
            aria-controls="rollAccordionBody">

            <span>
                <span class="roll-toggle-icon">▸</span>
                View All Students
            </span>

            <span class="roll-toggle-count" id="rollToggleCount">
                84
            </span>

        </button>



        <div
            class="roll-accordion-body"
            id="rollAccordionBody"
            hidden>


            <div class="roll-list" id="rollList">

                <!-- Rows injected by JavaScript -->

            </div>


        </div>


    </div>



    <!-- EMPTY STATE -->

    <div
        class="roll-empty"
        id="rollEmpty"
        hidden>

        No student found for this search.

    </div>



    <!-- INFO -->

    <div class="info-box">

        Search by <strong>Class Roll</strong>,
        <strong>Exam Roll</strong> or <strong>Name</strong>.
        Tap a result to expand the full list.

    </div>


</section>

/* ================= HIGHLIGHT MATCH ================= */

        rgba(255, 214, 102, .18);

    border-radius: 3px;

    padding: 0 2px;

    color: #ffe7a3;
}



/* ================= EMPTY STATE ================= */

    margin-top: 12px;

    padding: 16px;

    border-radius: 12px;

    background:
        rgba(0,0,0,.16);

    border:
        1px dashed rgba(255,255,255,.15);

    }

    }

/* =====================================================
   HELPERS
   ===================================================== */

const $ = (id) => document.getElementById(id);

const pad2 = (n) => String(n).padStart(2, "0");



function escapeHtml(str) {

    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



/* =====================================================
   BUILD ROW
   ===================================================== */

function buildRow(student) {

    return `
        <article class="roll-row">

            <div class="roll-exam">

                <strong>${student.exam}</strong>

                <span>EXAM ROLL</span>

            </div>

            <div class="roll-info">

                <h3>${escapeHtml(student.name)}</h3>

                <p>
                    Class Roll:
                    <strong>${pad2(student.classRoll)}</strong>
                </p>

            </div>

        </article>
    `;

}



/* =====================================================
   RENDER LIST
   ===================================================== */

function renderList(list) {

    const rollList = $("rollList");

    const empty = $("rollEmpty");

    const countLabel = $("rollResultsCount");

    const toggleCount = $("rollToggleCount");


    if (list.length === 0) {

        rollList.innerHTML = "";

        empty.hidden = false;

        countLabel.textContent = "No matching student found";

        toggleCount.textContent = "0";

        return;

    }


    empty.hidden = true;

    rollList.innerHTML =
        list.map(buildRow).join("");


    countLabel.textContent =
        `Showing ${list.length} of ${students.length} students`;

    toggleCount.textContent = list.length;

}



/* =====================================================
   SEARCH
   ===================================================== */

function runSearch(query) {

    const q = query.trim().toLowerCase();


    if (!q) {

        renderList(students);

        return;

    }


    const filtered = students.filter((s) => {

        return (

            String(s.classRoll).includes(q) ||

            String(s.exam).includes(q) ||

            s.name.toLowerCase().includes(q)

        );

    });


    renderList(filtered);



    /* Auto-open accordion when searching */

    if (filtered.length > 0) {

        openAccordion();

    }

}



/* =====================================================
   ACCORDION
   ===================================================== */

function openAccordion() {

    const body = $("rollAccordionBody");

    const toggle = $("rollToggle");

    body.hidden = false;

    /* allow layout before class */

    requestAnimationFrame(() => {

        body.classList.add("is-open");

    });

    toggle.setAttribute("aria-expanded", "true");

    toggle.querySelector(".roll-toggle-icon").textContent = "▾";

    toggle.firstElementChild.lastChild.textContent = " Hide All Students";

}



function closeAccordion() {

    const body = $("rollAccordionBody");

    const toggle = $("rollToggle");

    body.classList.remove("is-open");

    toggle.setAttribute("aria-expanded", "false");

    toggle.querySelector(".roll-toggle-icon").textContent = "▸";

    toggle.firstElementChild.lastChild.textContent = " View All Students";

    setTimeout(() => {

        if (!body.classList.contains("is-open")) {

            body.hidden = true;

        }

    }, 350);

}



function toggleAccordion() {

    const toggle = $("rollToggle");

    const isOpen = toggle.getAttribute("aria-expanded") === "true";

    isOpen ? closeAccordion() : openAccordion();

}



/* =====================================================
   INIT
   ===================================================== */

(function initRollDirectory() {

    if (!document.getElementById("rollDirectory")) return;


    renderList(students);


    $("rollToggle").addEventListener("click", toggleAccordion);


    let searchTimer = null;

    $("rollSearch").addEventListener("input", (e) => {

        const value = e.target.value;

        clearTimeout(searchTimer);

        searchTimer = setTimeout(() => runSearch(value), 120);

    });


    /* Enter key opens results */

    $("rollSearch").addEventListener("keydown", (e) => {

        if (e.key === "Enter") {

            e.preventDefault();

            runSearch(e.target.value);

        }

    });


})();
